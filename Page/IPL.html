<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mainframe IPL Simulator</title>

<style>
body{
    background:black;
    color:#00ff00;
    font-family: "Courier New", monospace;
    font-size:16px;
    padding:20px;
}

#console{
    white-space:pre;
}

button{
    background:#111;
    color:#0f0;
    border:1px solid #0f0;
    padding:10px;
    margin-bottom:20px;
    font-family:monospace;
}

.top-bar{
margin-bottom:20px;
}

.back-button{

display:inline-block;
padding:10px 18px;

background:#000;
color:#00ff00;

border:2px solid #00ff00;

text-decoration:none;
font-family:Courier New, monospace;

transition:0.2s;

}

.back-button:hover{

background:#00ff00;
color:#000;

}

</style>
</head>

<body>

<button class="back-button" onclick="goBack()">← Voltar</button>
<script>
function goBack(){
window.history.back()
}
</script>

<h2>Mainframe IPL Simulator</h2>

<button onclick="startIPL()">Start IPL</button>

<div id="console"></div>

<script>

const messages = [

"IEA101A SPECIFY SYSTEM PARAMETERS",
"IEA101A REPLY U",

"IEA000I IPL IN PROGRESS",

"IEA371I MASTER SCHEDULER INITIALIZED",

"IEF403I JES2 STARTED",

"$HASP426 JES2 INITIALIZATION COMPLETE",

"IEF196I START JES2",

"IEE252I MEMBER IEASYS00 FOUND",

"IEE174I SYSTEM PARAMETERS ACCEPTED",

"IEE254I SYSTEM INITIALIZATION COMPLETE",

"IKT005I TSO INITIALIZATION COMPLETE",

"READY"
];

let i = 0;

function startIPL(){

    document.getElementById("console").innerHTML="";
    i = 0;

    const interval = setInterval(function(){

        if(i >= messages.length){
            clearInterval(interval);
            return;
        }

        document.getElementById("console").innerHTML += messages[i] + "\n";
        i++;

    },1200);

}

</script>

</body>
</html>
