<h1>Mainframe Simulator</h1>
<h2>Unit 7 - Recovery Termination Manager</h2>

<p>Simulação de tratamento de erros e ABENDs pelo RTM.</p>

<button onclick="runProgram()">Run Program</button>
<button onclick="causeAbend()">Generate ABEND</button>
<button onclick="recovery()">Execute Recovery Routine</button>
<button onclick="dump()">Generate System Dump</button>
<button onclick="terminate()">Terminate Task</button>

<div id="console"></div>

<script>

let programRunning=false
let abendCode=""

function log(text,type){

let consoleDiv=document.getElementById("console")

if(type==="error")
consoleDiv.innerHTML+="<span class='error'>"+text+"</span>\n"

else if(type==="dump")
consoleDiv.innerHTML+="<span class='dump'>"+text+"</span>\n"

else
consoleDiv.innerHTML+=text+"\n"

consoleDiv.scrollTop=consoleDiv.scrollHeight

}

function runProgram(){

programRunning=true

log("Program started")
log("Task running in problem state")

}

function causeAbend(){

if(!programRunning){

log("No program running")
return

}

let abends=["S0C4","S0C7","S322","S806"]

abendCode=abends[Math.floor(Math.random()*abends.length)]

log("ABEND DETECTED: "+abendCode,"error")

log("RTM invoked")

}

function recovery(){

if(!abendCode){

log("No error detected")
return

}

log("Executing ESTAE recovery routine")

log("Cleaning resources")

}

function dump(){

if(!abendCode){

log("No ABEND to dump")
return

}

log("Generating system dump...","dump")

log("Dump dataset SYS1.DUMP created","dump")

}

function terminate(){

if(!abendCode){

log("No task to terminate")
return

}

log("RTM terminating task")

log("Control returned to system")

programRunning=false
abendCode=""

}

</script>

</body>
